name: Optimize images

on:
  push:
    branches: [main]
    paths:
      - "work/*.jpg"
      - "images/**"
      - ".github/workflows/optimize-images.yml"

permissions:
  contents: write

jobs:
  webp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cwebp
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Convert large JPGs to WebP
        run: |
          find work images -type f -iname "*.jpg" -size +150k -print0 2>/dev/null | while IFS= read -r -d '' file; do
            cwebp -quiet -q 82 "$file" -o "${file%.*}.webp"
          done

      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/*.webp images/*.webp 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new WebP files."
          else
            git commit -m "chore: add WebP image variants"
            git push
          fi
